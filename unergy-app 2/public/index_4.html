<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UNERGY</title>
<style>
:root{
  --ink:#F5F8F6; --panel:#FFFFFF; --panel2:#EEF5F0; --line:#DCE6E0; --amber:#1FA24A; --amber-dim:#0F6B30;
  --teal:#2472A4; --red:#D9432B; --green:#2FAE66; --text:#12241C; --textdim:#5C6F66;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--ink);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;min-height:100vh;}
.mono{font-family:'Courier New',monospace;}
h1,h2,h3{font-weight:700;letter-spacing:-.02em;}
.pulse-wrap{height:2px;width:100%;background:var(--line);position:relative;overflow:hidden;}
.pulse{position:absolute;top:0;left:-30%;height:2px;width:30%;
  background:linear-gradient(90deg, transparent, var(--amber), var(--teal), transparent);
  animation:travel 3.2s linear infinite;}
@keyframes travel{ to{ left:130%; } }
.app{max-width:1320px;margin:0 auto;padding:0 20px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px;}
.brand{display:flex;align-items:center;gap:12px;}
.logo-img{height:64px;width:auto;border-radius:6px;display:block;}
.brand .sub{color:var(--textdim);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:20px 0;}
.hero-copy{text-align:center;}
.hero-title{color:#FFFFFF;font-size:clamp(28px,5vw,46px);line-height:1.15;margin:0;
  text-shadow:0 2px 18px rgba(0,0,0,.4);letter-spacing:-.01em;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:36px;width:100%;max-width:420px;
  box-shadow:0 1px 3px rgba(18,36,28,.06), 0 8px 24px rgba(18,36,28,.05);}
.card h2{margin:0 0 6px;font-size:22px;}
.card p.hint{color:var(--textdim);font-size:13px;margin:0 0 24px;}
label{display:block;font-size:12px;color:var(--textdim);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;margin-top:16px;}
label:first-of-type{margin-top:0;}
input,select,textarea{width:100%;background:#FFFFFF;border:1px solid var(--line);color:var(--text);
  padding:10px 12px;border-radius:6px;font-size:14px;font-family:inherit;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);}
input:disabled,select:disabled,textarea:disabled{opacity:.6;cursor:not-allowed;background:var(--panel2);}
button{font-family:inherit;font-weight:600;font-size:14px;border:none;border-radius:6px;
  padding:11px 18px;cursor:pointer;transition:transform .1s ease, opacity .15s;}
button:active{transform:scale(.98);}
.btn-primary{background:var(--amber);color:#FFFFFF;width:100%;margin-top:22px;}
.btn-primary:hover{opacity:.9;}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
.btn-ghost:hover{border-color:var(--textdim);}
.btn-teal{background:var(--teal);color:#FFFFFF;}
.btn-small{padding:6px 12px;font-size:12px;}
.err{color:var(--red);font-size:13px;margin-top:12px;}
.subtle-link{background:none;border:none;color:var(--textdim);font-size:12px;text-decoration:underline;cursor:pointer;padding:0;margin-top:20px;display:block;text-align:center;width:100%;}
.subtle-link:hover{color:var(--text);}
.role-badge{font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:4px 10px;border-radius:20px;
  background:var(--panel2);border:1px solid var(--line);color:var(--textdim);}
.role-badge.admin{border-color:var(--amber-dim);color:var(--amber);}
.role-badge.partner{border-color:#1c4d6e;color:var(--teal);}
.tabs{display:flex;gap:4px;margin:18px 0 4px;border-bottom:1px solid var(--line);}
.tab-btn{background:transparent;border:none;color:var(--textdim);padding:10px 6px;font-weight:600;font-size:13.5px;
  border-bottom:2px solid transparent;border-radius:0;}
.tab-btn.active{color:var(--amber);border-bottom-color:var(--amber);}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0 16px;justify-content:space-between;}
.toolbar-left{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:96px;}
.stat .n{font-size:22px;font-weight:700;}
.stat .l{font-size:10.5px;color:var(--textdim);text-transform:uppercase;letter-spacing:.5px;}
.stats-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;}
table{width:100%;border-collapse:collapse;background:var(--panel);min-width:900px;}
thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--textdim);
  padding:11px 13px;border-bottom:1px solid var(--line);background:var(--panel2);white-space:nowrap;}
tbody td{padding:11px 13px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top;white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:rgba(31,162,74,.04);}
.company-tag{font-size:11px;color:var(--teal);}
.badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap;}
.b-new{background:rgba(217,119,6,.12);color:#B45309;}
.b-warn{background:rgba(217,68,43,.12);color:#B23422;}
.b-progress{background:rgba(36,114,164,.12);color:#1B587D;}
.b-active{background:rgba(47,174,102,.14);color:#1B7A45;}
.empty{padding:50px 20px;text-align:center;color:var(--textdim);}
.empty .big{font-size:16px;color:var(--text);margin-bottom:6px;font-weight:700;}
.modal-bg{position:fixed;inset:0;background:rgba(18,36,28,.45);display:flex;align-items:flex-start;justify-content:center;
  padding:40px 16px;overflow-y:auto;z-index:50;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px;max-width:640px;width:100%;
  box-shadow:0 12px 32px rgba(18,36,28,.15);}
.modal.wide{max-width:760px;}
.modal h3{margin:0 0 4px;}
.modal .close{position:relative;float:right;background:none;color:var(--textdim);font-size:20px;padding:0 4px;}
.panel-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;max-width:760px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.actions{display:flex;gap:10px;margin-top:24px;}
.actions button{flex:1;}
.small{font-size:12px;color:var(--textdim);}
.code-pill{font-family:'Courier New',monospace;background:var(--panel2);border:1px dashed var(--line);padding:2px 8px;border-radius:4px;color:var(--amber);}
select.status-select{width:auto;padding:6px 8px;font-size:12px;}
.company-list{margin-top:10px;}
.company-row{padding:12px;border:1px solid var(--line);border-radius:6px;margin-bottom:10px;background:var(--panel2);}
.company-row .cname{font-weight:600;font-size:14px;margin-bottom:8px;}
.code-line{display:flex;justify-content:space-between;align-items:center;padding:5px 0;}
.code-line .lbl{font-size:11.5px;color:var(--textdim);}
.filter-select{width:auto;min-width:150px;}
.top-actions{display:flex;gap:8px;}
a.linklike{color:var(--teal);cursor:pointer;text-decoration:underline;font-size:12.5px;}
.footer-note{color:var(--textdim);font-size:11.5px;margin-top:40px;text-align:center;}
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--amber);margin-top:22px;margin-bottom:4px;font-weight:600;}
.section-label:first-of-type{margin-top:0;}
.bill-thumb{max-width:180px;max-height:120px;border-radius:6px;border:1px solid var(--line);display:block;margin-top:6px;}
.bill-file-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--panel2);border:1px solid var(--line);
  padding:6px 10px;border-radius:6px;color:var(--textdim);}
.locked-note{font-size:10.5px;color:var(--textdim);margin-left:6px;text-transform:none;letter-spacing:0;}
.success-box{background:rgba(47,174,102,.12);border:1px solid #bfe4cc;color:#1B7A45;padding:14px 16px;border-radius:8px;margin:16px 0;font-size:13.5px;}
.msg-thread{max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px 2px;margin:14px 0;}
.msg-bubble{max-width:78%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.4;}
.msg-bubble.mine{align-self:flex-end;background:var(--amber);color:#FFFFFF;border-bottom-right-radius:3px;}
.msg-bubble.theirs{align-self:flex-start;background:var(--panel2);color:var(--text);border-bottom-left-radius:3px;}
.msg-client-tag{font-size:10.5px;opacity:.85;font-style:italic;margin-bottom:3px;display:block;}
.msg-meta{font-size:10px;opacity:.7;margin-top:4px;}
.msg-input-row{display:flex;gap:8px;margin-top:6px;}
.msg-input-row textarea{flex:1;resize:none;}
.unread-pill{background:var(--red);color:#fff;border-radius:20px;padding:1px 6px;font-size:10.5px;margin-left:4px;}
.kpi-summary{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0 24px;}
.kpi-card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px 18px;flex:1;min-width:150px;}
.kpi-card .kn{font-size:22px;font-weight:700;}
.kpi-card .kl{font-size:11px;color:var(--textdim);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.kpi-legend{display:flex;gap:16px;font-size:12px;color:var(--textdim);margin-bottom:10px;}
.kpi-legend span{display:inline-flex;align-items:center;gap:6px;}
.kpi-swatch{width:10px;height:10px;border-radius:2px;display:inline-block;}
.kpi-chart{display:flex;gap:18px;align-items:flex-end;height:200px;overflow-x:auto;padding:10px 4px 0;border-bottom:1px solid var(--line);}
.kpi-month{display:flex;flex-direction:column;align-items:center;min-width:52px;}
.kpi-bars{display:flex;gap:4px;align-items:flex-end;height:160px;}
.kpi-bar{width:16px;border-radius:3px 3px 0 0;min-height:2px;}
.kpi-bar.electric{background:var(--amber);}
.kpi-bar.vpp{background:var(--teal);}
.kpi-bar.combined{background:var(--green);}
.kpi-bar.added{background:var(--green);}
.kpi-bar.lost{background:var(--red);}
.kpi-month-label{font-size:10px;color:var(--textdim);margin-top:6px;white-space:nowrap;}
.health-bar{height:20px;border-radius:10px;overflow:hidden;display:flex;background:var(--panel2);border:1px solid var(--line);}
.health-bar .seg-ontime{background:var(--green);}
.health-bar .seg-delinq{background:var(--red);}
.grid-widget{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:20px;}
.grid-widget-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
.grid-widget-title{font-size:13px;font-weight:700;letter-spacing:.3px;}
.grid-condition-pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;}
.grid-condition-pill.normal{background:rgba(47,174,102,.15);color:#1B7A45;}
.grid-condition-pill.watch{background:rgba(217,119,6,.15);color:#B45309;}
.grid-condition-pill.emergency{background:rgba(217,68,43,.15);color:var(--red);}
.grid-widget-body{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end;}
.grid-prc-value{font-size:26px;font-weight:700;}
.grid-prc-label{font-size:10.5px;color:var(--textdim);text-transform:uppercase;letter-spacing:.4px;margin-top:2px;}
.grid-sparkline{flex:1;min-width:180px;}
.grid-fuelmix-bar{display:flex;height:14px;border-radius:4px;overflow:hidden;width:100%;margin-top:4px;}
.grid-fuelmix-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11px;color:var(--textdim);}
.grid-fuelmix-legend span{display:inline-flex;align-items:center;gap:4px;}
.grid-swatch{width:9px;height:9px;border-radius:2px;display:inline-block;}
.grid-widget-foot{font-size:10.5px;color:var(--textdim);margin-top:10px;}
.grid-widget-foot a{color:var(--teal);}
tr.row-green{background:rgba(47,174,102,.10);}
tr.row-green:hover{background:rgba(47,174,102,.17);}
tr.row-red{background:rgba(217,68,43,.09);}
tr.row-red:hover{background:rgba(217,68,43,.16);}
tr.row-yellow{background:rgba(217,119,6,.10);}
tr.row-yellow:hover{background:rgba(217,119,6,.17);}
::placeholder{color:#9AAAA2;}

/* ---- public hero background (login/access screen only) ---- */

</style>

<script>
(function(){
"use strict";

var STATUSES = ["NEW","Missing Information","Missing Electric Bill","Working on Contract","Waiting on approval","Contract Sent","Contract Signed","Ready to activate","Activated","Will NOT send Contract","Cancelled"];
var SOLAR_BATTERY_OPTS = ["Solar and Battery","Solar","Battery Only","Non Solar"];
var PROPERTY_TYPES = ["Residential","Commercial"];
var MOVE_SWITCH = ["Move in","Switch"];
var TERM_OPTS = ["12","24","36"];
var TDU_OPTS = ["AEP","Oncor","Center Point","TNMP"];
var OWNS_RENTS = ["Owns","Rents"];

function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }
function normEmail(e){ return (e || "").trim().toLowerCase(); }
function genTempPassword(){
  var chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
  var s = "";
  for(var i=0;i<10;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function esc(str){
  if(str === null || str === undefined) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function badgeClass(status){
  if(status === "NEW") return "b-new";
  if(["Missing Information","Missing Electric Bill","Cancelled","Will NOT send Contract"].indexOf(status) > -1) return "b-warn";
  if(["Working on Contract","Waiting on approval","Contract Sent","Ready to activate"].indexOf(status) > -1) return "b-progress";
  if(["Contract Signed","Activated"].indexOf(status) > -1) return "b-active";
  return "b-progress";
}
function rowStatusClass(d){
  if(d.status === "Cancelled" || d.status === "Will NOT send Contract") return "row-red";
  if(["30 Days Late","60 Days Late","90 Days Late","Disconnected"].indexOf(d.paymentStatus) > -1) return "row-red";
  if(d.status === "Activated") return "row-green";
  if(d.status === "Waiting on approval") return "row-yellow";
  return "";
}
function fmtDate(iso){
  if(!iso) return "—";
  var d = new Date(iso);
  if(isNaN(d.getTime())) return "—";
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
}
function optionsHtml(list, selected, includeBlank){
  var out = includeBlank ? '<option value="">—</option>' : "";
  for(var i=0;i<list.length;i++){
    var v = list[i];
    out += '<option value="'+esc(v)+'"'+(v===selected?" selected":"")+'>'+esc(v)+'</option>';
  }
  return out;
}

/* ---------- backend API client ----------
   Every read/write goes through the server, which checks the caller's
   token before returning or changing anything. The browser never holds
   another company's data, a password, or a password hash. */
var API_BASE = "/api";
function apiCall(action, params){
  var headers = {"Content-Type":"application/json"};
  if(APP.authToken) headers["Authorization"] = "Bearer " + APP.authToken;
  return fetch(API_BASE, {method:"POST", headers:headers, body: JSON.stringify({action:action, params:params||{}})})
    .then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(data){
        if(!r.ok){ throw new Error(data.error || ("Request failed (" + r.status + ")")); }
        return data;
      });
    });
}
function notifScopeForSession(){
  if(!APP.session) return null;
  if(APP.session.role === "admin") return "admin";
  if(APP.session.mode === "review") return APP.session.companyId;
  return null; // reps get no notification feed — they have no ongoing visibility anyway
}
function pushNotification(scope, message){
  return apiCall("pushNotification", {scope: scope, message: message}).catch(function(){});
}

function readBillFile(file){
  return new Promise(function(resolve, reject){
    if(file.size > 8 * 1024 * 1024){ reject(new Error("File is too large (max 8MB before compression).")); return; }
    if(file.type === "application/pdf"){
      if(file.size > 1.5 * 1024 * 1024){ reject(new Error("PDF is over 1.5MB — please upload a compressed PDF or a photo instead.")); return; }
      var r = new FileReader();
      r.onload = function(){ resolve({name:file.name, type:file.type, dataUrl:r.result}); };
      r.onerror = function(){ reject(new Error("Couldn't read that file.")); };
      r.readAsDataURL(file);
      return;
    }
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var maxW = 1100;
        var scale = Math.min(1, maxW / img.width);
        var canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve({name:file.name, type:"image/jpeg", dataUrl: canvas.toDataURL("image/jpeg", 0.72)});
      };
      img.onerror = function(){ reject(new Error("Couldn't read that image.")); };
      img.src = reader.result;
    };
    reader.onerror = function(){ reject(new Error("Couldn't read that file.")); };
    reader.readAsDataURL(file);
  });
}

function emptyDeal(companyId, source){
  var now = new Date().toISOString();
  return {
    id: uid("acct"), companyId: companyId, source: source,
    customerName:"", businessName:"", ownsOrRents:"",
    email:"", phone:"", serviceAddress:"", billingAddress:"",
    solarBattery: SOLAR_BATTERY_OPTS[0], propertyType: PROPERTY_TYPES[0],
    tdu:"", currentREP:"", moveOrSwitch: MOVE_SWITCH[0], esiid:"",
    contractTerm:"12", priceKWH:"", salesRepName:"",
    intakeDate: now.slice(0,10), contractSentDate:"", contractSignedDate:"", startDate:"",
    status:"NEW", notes:"", billFile:null,
    switchHold:"No", paymentStatus:"Current", vppEnabled:"No", batteryBrand:"", billingLog: [],
    createdAt: now, updatedAt: now
  };
}
var SWITCH_HOLD_OPTS = ["No","Yes"];
var PAYMENT_STATUS_OPTS = ["Current","30 Days Late","60 Days Late","90 Days Late","Disconnected"];
var BATTERY_BRAND_OPTS = ["SolarEdge","Enphase","Tesla","Lion Energy","Duracell","Ecopro","Other"];
var VPP_ENABLED_OPTS = ["No","Yes"];

/* ============ APP STATE ============ */
// Nothing is fetched from storage until a login action is attempted — the page loads empty.
var APP = { session: null, authToken: null, companies: [], deals: [], loginErr:"", showAdminField:false, partnerTab:"review", loginFlow:"submit", notifications: [], messagesByCompany: {}, activeMsgCompany: null, adminTeam: [], filterCo:"all", filterStatus:"all", searchQuery:"" };
var gridRefreshTimer = null;
var root = document.getElementById("root");
var modalLayer = document.getElementById("modal-layer");
var lightboxLayer = document.getElementById("lightbox-layer");
var pendingBillFile = null;
var pendingBillingLog = null;

/* ============ RENDER ============ */
function renderApp(){
  document.body.classList.toggle("app-authed", !!APP.session);
  var html = buildTopbar();
  if(!APP.session) html += buildLoginGate();
  else if(APP.session.role === "admin") html += buildAdminView();
  else html += buildPartnerView();
  html += '<div class="footer-note">Access codes are a front-end gate, not encrypted login — treat them like a shared password. Each portal only ever loads its own company\'s data from storage.</div>';

function totalUnreadMessages(){
  if(!APP.session) return 0;
  if(APP.session.role === "admin"){
    var total = 0;
    Object.keys(APP.messagesByCompany).forEach(function(cid){
      total += APP.messagesByCompany[cid].filter(function(m){ return m.from === "partner" && !m.readByAdmin; }).length;
    });
    return total;
  }
  if(APP.session.mode === "review"){
    var thread = APP.messagesByCompany[APP.session.companyId] || [];
    return thread.filter(function(m){ return m.from === "admin" && !m.readByPartner; }).length;
  }
  return 0;
}
function buildTopbar(){
  var right = "";
  if(APP.session){
    var label;
    if(APP.session.role === "admin") label = "UNERGY Internal";
    else label = esc(APP.session.companyName) + (APP.session.mode === "rep" ? " · Submit access" : " · Client review");
    var unreadNotifs = APP.notifications.filter(function(n){ return !n.read; }).length;
    var unreadMsgs = totalUnreadMessages();
    var bell = "", msgBtn = "";
    if(APP.session.role === "admin" || APP.session.mode === "review"){
      bell = '<button class="btn-ghost btn-small" data-action="open-notifs">Updates' +
        (unreadNotifs > 0 ? ' <span class="unread-pill">'+unreadNotifs+'</span>' : '') + '</button>';
      msgBtn = '<button class="btn-ghost btn-small" data-action="open-messages">Messages' +
        (unreadMsgs > 0 ? ' <span class="unread-pill">'+unreadMsgs+'</span>' : '') + '</button>';
    }
    var pwBtn = '<button class="btn-ghost btn-small" data-action="open-change-password">My password</button>';
    right = '<div style="display:flex;align-items:center;gap:10px;">' +
      bell + msgBtn + (APP.session.role !== "admin" ? pwBtn : "") +
      '<span class="role-badge '+(APP.session.role==="admin"?"admin":"partner")+'">'+label+'</span>' +
      '<button class="btn-ghost btn-small" data-action="logout">Sign out</button></div>';
  }
  return '<div class="topbar"><div class="brand">' +
    '<img src="data:image/png;base64,'+LOGO_B64+'" alt="UNERGY" class="logo-img">' +
    '<div class="sub">Access your clients</div>' +
    '</div>' + right + '</div>';
}

function buildLoginGate(){
  var heroCopy = '<div class="hero-copy"><h1 class="hero-title">Powering Texas.<br>Empowering You.</h1></div>';
  if(APP.showAdminField){
    var body = '<h2>Internal sign-in</h2><p class="hint">UNERGY team only.</p>' +
      '<label>Email</label><input id="login-email" type="email" placeholder="you@unergypowercompany.com">' +
      '<label>Password</label><input type="password" id="login-password" placeholder="••••••••">' +
      '<button class="btn-primary" data-action="login-submit">Sign in</button>' +
      '<button class="subtle-link" data-action="hide-admin">Back</button>';
    return '<div class="center">' + heroCopy + '<div class="card">' + body +
      (APP.loginErr ? '<div class="err">'+esc(APP.loginErr)+'</div>' : '') + '</div></div>';
  }
  var flow = APP.loginFlow || "submit";
  var isSubmit = flow === "submit";
  var switcher = '<div class="tabs" style="margin:0 0 22px;border-bottom:1px solid var(--line);">' +
    '<button class="tab-btn '+(isSubmit?"active":"")+'" data-action="flow-submit" style="flex:1;text-align:center;">Submit a Client</button>' +
    '<button class="tab-btn '+(isSubmit?"":"active")+'" data-action="flow-access" style="flex:1;text-align:center;">Access Your Clients</button>' +
    '</div>';
  var body2;
  if(isSubmit){
    body2 = '<h2>Submit a client</h2><p class="hint">Enter your company\'s access code. This sends a new lead straight to UNERGY — you won\'t see the client list.</p>' +
      '<label>Access code</label><input id="submit-code" placeholder="e.g. 7K3PXQ">' +
      '<button class="btn-primary" data-action="submit-with-code">Continue</button>';
  } else {
    body2 = '<h2>Access your clients</h2><p class="hint">Sign in with the email UNERGY set up for you to review your accounts.</p>' +
      '<label>Email</label><input id="login-email" type="email" placeholder="you@company.com">' +
      '<label>Password</label><input type="password" id="login-password" placeholder="••••••••">' +
      '<button class="btn-primary" data-action="login-submit">Sign in</button>';
  }
  return '<div class="center">' + heroCopy + '<div class="card">' + switcher + body2 +
    (APP.loginErr ? '<div class="err">'+esc(APP.loginErr)+'</div>' : '') +
    '<button class="subtle-link" data-action="show-admin">UNERGY team? Sign in here</button>' +
    '</div></div>';
}

function companyName(id){
  var c = APP.companies.filter(function(x){ return x.id === id; })[0];
  return c ? c.name : "—";
}

/* ============ ADMIN ============ */
function buildAdminView(){
  var deals = APP.deals.slice();
  var q = (APP.searchQuery || "").trim().toLowerCase();
  var filtered = deals.filter(function(d){
    if(!((APP.filterCo === "all" || !APP.filterCo || d.companyId === APP.filterCo) &&
         (APP.filterStatus === "all" || !APP.filterStatus || d.status === APP.filterStatus))) return false;
    if(!q) return true;
    var hay = [d.customerName, d.serviceAddress, d.billingAddress, d.email, d.phone, d.esiid, d.currentREP].join(" ").toLowerCase();
    return hay.indexOf(q) > -1;
  }).sort(function(a,b){ return new Date(b.updatedAt) - new Date(a.updatedAt); });

  var newCount = deals.filter(function(d){ return d.status === "NEW"; }).length;
  var activeCount = deals.filter(function(d){ return d.status !== "Cancelled" && d.status !== "Will NOT send Contract"; }).length;
  var activatedCount = deals.filter(function(d){ return d.status === "Activated"; }).length;

  var coOpts = '<option value="all">All companies</option>';
  APP.companies.forEach(function(c){ coOpts += '<option value="'+esc(c.id)+'"'+(APP.filterCo===c.id?" selected":"")+'>'+esc(c.name)+'</option>'; });
  var statusOpts = '<option value="all">All statuses</option>' + optionsHtml(STATUSES, APP.filterStatus, false);

  var html = buildGridWidget();
  html += '<div class="stats-row">' +
    stat(deals.length, "Total accounts") + stat(newCount, "New", "var(--amber)") +
    stat(activeCount, "In pipeline", "var(--teal)") + stat(activatedCount, "Active", "var(--green)") +
    stat(APP.companies.length, "Partners") + '</div>';

  html += '<div class="toolbar"><div class="toolbar-left">' +
    '<input id="search-query" placeholder="Search customer, address, email, phone, ESIID…" value="'+esc(APP.searchQuery||"")+'" style="width:auto;min-width:240px;">' +
    '<select class="filter-select" id="filter-co">'+coOpts+'</select>' +
    '<select class="filter-select" id="filter-status">'+statusOpts+'</select>' +
    '</div><div class="top-actions">' +
    '<button class="btn-ghost btn-small" data-action="open-companies">Manage partners</button>' +
    '<button class="btn-ghost btn-small" data-action="open-admin-team">UNERGY team</button>' +
    '<button class="btn-ghost btn-small" data-action="open-change-password">Change my password</button>' +
    '<button class="btn-ghost btn-small" data-action="open-kpis">KPIs</button>' +
    '<button class="btn-teal btn-small" data-action="open-add-deal">+ Add account</button>' +
    '</div></div>';

  if(APP.saveErr) html += '<div class="err" style="margin-bottom:12px;">Last change may not have saved — check your connection.</div>';

  if(filtered.length === 0){

/* ============ Texas Grid Status widget (real data, fetched server-side via the backend) ============ */
var FUEL_COLORS = {
  "natural_gas": "#F5A623", "wind": "#2472A4", "solar": "#1FA24A", "nuclear": "#8B5CF6",
  "coal_and_lignite": "#6B4A3A", "hydro": "#33C9C9", "power_storage": "#2FAE66", "other": "#93A2BA"
};
function gridNiceLabel(key){
  return String(key).replace(/_/g," ").replace(/\b\w/g, function(c){ return c.toUpperCase(); });
}
var APP_GRID = { status:"idle", price:null, priceLabel:null, series:[], fuelMix:null, fetchedAt:null };
function fetchGridData(){
  APP_GRID.status = "loading";
  apiCall("getGridStatus", {}).then(function(res){
    if(!res.available){ APP_GRID.status = "error"; renderApp(); return; }
    APP_GRID.status = "ok";
    APP_GRID.price = res.price;
    APP_GRID.priceLabel = res.priceLabel;
    APP_GRID.series = res.series || [];
    APP_GRID.fuelMix = res.fuelMix;
    APP_GRID.fetchedAt = res.fetchedAt;
    renderApp();
  }).catch(function(){ APP_GRID.status = "error"; renderApp(); });
}
function startGridRefresh(){
  fetchGridData();
  if(gridRefreshTimer) clearInterval(gridRefreshTimer);
  gridRefreshTimer = setInterval(fetchGridData, 60000);
}
function stopGridRefresh(){
  if(gridRefreshTimer){ clearInterval(gridRefreshTimer); gridRefreshTimer = null; }
}
function sparklineSvg(series){
  if(!series || series.length < 2) return "";
  var min = Math.min.apply(null, series), max = Math.max.apply(null, series);
  var range = (max - min) || 1;
  var w = 240, h = 44;
  var pts = series.map(function(v, i){
    var x = (i / (series.length - 1)) * w;
    var y = h - ((v - min) / range) * h;
    return x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none">' +
    '<polyline points="'+pts+'" fill="none" stroke="var(--teal)" stroke-width="2"/></svg>';
}
function buildGridWidget(){
  var g = APP_GRID;
  if(g.status === "idle" || g.status === "loading"){
    return '<div class="grid-widget"><div class="small">Loading live Texas grid data\u2026</div></div>';
  }
  if(g.status === "error"){
    return '<div class="grid-widget"><div class="grid-widget-title">Texas Grid Status</div>' +
      '<p class="small" style="margin-top:6px;">Live data isn\'t available right now.</p>' +
      '<div class="grid-widget-foot">View it directly: <a href="https://www.gridstatus.io/live/ercot" target="_blank" rel="noopener">gridstatus.io/live/ercot</a></div>' +
      '</div>';
  }
  var fuelHtml = "";
  if(g.fuelMix){
    var total = 0;
    Object.keys(g.fuelMix).forEach(function(k){ total += g.fuelMix[k]; });
    if(total > 0){
      var bars = "", legend = "";
      Object.keys(g.fuelMix).sort(function(a,b){ return g.fuelMix[b]-g.fuelMix[a]; }).forEach(function(k){
        var pct = (g.fuelMix[k] / total) * 100;
        if(pct < 0.5) return;
        var color = FUEL_COLORS[k.toLowerCase()] || "#93A2BA";
        var label = gridNiceLabel(k);
        bars += '<div style="width:'+pct.toFixed(1)+'%;background:'+color+';" title="'+esc(label)+': '+pct.toFixed(1)+'%"></div>';
        legend += '<span><span class="grid-swatch" style="background:'+color+';"></span>'+esc(label)+' '+pct.toFixed(0)+'%</span>';
      });
      fuelHtml = '<div style="flex:1;min-width:220px;"><div class="grid-prc-label">Live fuel mix</div>' +
        '<div class="grid-fuelmix-bar">'+bars+'</div><div class="grid-fuelmix-legend">'+legend+'</div></div>';
    }
  }
  var fetchedLabel = g.fetchedAt ? new Date(g.fetchedAt).toLocaleTimeString() : "";
  return '<div class="grid-widget">' +
    '<div class="grid-widget-top"><div class="grid-widget-title">Texas Grid Status (gridstatus.io, live)</div></div>' +
    '<div class="grid-widget-body">' +
      '<div><div class="grid-prc-value">'+(g.price!=null ? "$"+g.price.toFixed(2) : "\u2014")+'</div><div class="grid-prc-label">'+esc(g.priceLabel || "Day-ahead settlement price")+'</div></div>' +
      '<div class="grid-sparkline">'+sparklineSvg(g.series)+'<div class="grid-prc-label">Last 24h trend</div></div>' +
      fuelHtml +
    '</div>' +
    '<div class="grid-widget-foot">Source: gridstatus.io API' + (fetchedLabel ? (" \u00b7 fetched " + esc(fetchedLabel)) : "") +
    '. Full detail at <a href="https://www.gridstatus.io/live/ercot" target="_blank" rel="noopener">gridstatus.io/live/ercot</a>.</div>' +
    '</div>';
}

function latestBillingEntry(log){
  if(!log || log.length === 0) return null;
  var sorted = log.slice().sort(function(a,b){ return (b.month||"").localeCompare(a.month||""); });

function fmtMoney(n){
  var v = parseFloat(n);
  if(isNaN(v)) return "—";
  return "$" + v.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtMonth(m){
  if(!m) return "—";
  var parts = m.split("-");
  if(parts.length !== 2) return m;
  var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, 1);
  return d.toLocaleDateString(undefined,{month:"short",year:"numeric"});
}
function billingLogListHtml(){
  var log = (pendingBillingLog || []).slice().sort(function(a,b){ return (b.month||"").localeCompare(a.month||""); });
  if(log.length === 0) return '<div class="small">No billing entries yet.</div>';
  var rows = log.map(function(entry){
    var idx = pendingBillingLog.indexOf(entry);
    return '<div class="code-line"><span class="lbl">'+esc(fmtMonth(entry.month))+' — Bill '+fmtMoney(entry.billAmount)+' · VPP '+fmtMoney(entry.vppRevenue)+
      ' · Sent '+fmtDate(entry.billSubmittedDate)+' · Paid '+(entry.billPaidDate?fmtDate(entry.billPaidDate):"—")+'</span>' +
      '<button class="btn-ghost btn-small" type="button" data-action="remove-billing-entry" data-idx="'+idx+'">Remove</button></div>';
  }).join("");
  return rows;
}
function addBillingEntry(){
  var month = document.getElementById("bl-month").value;
  if(!month) return;
  var entry = {
    id: uid("bl"), month: month,
    billAmount: document.getElementById("bl-amount").value,
    vppRevenue: document.getElementById("bl-vpp").value,
    billSubmittedDate: document.getElementById("bl-submitted").value,
    billPaidDate: document.getElementById("bl-paid").value
  };
  pendingBillingLog = (pendingBillingLog || []).concat([entry]);
  var listEl = document.getElementById("billing-log-list");
  if(listEl) listEl.innerHTML = billingLogListHtml();
  document.getElementById("bl-month").value = "";
  document.getElementById("bl-amount").value = "";

  document.getElementById("bl-submitted").value = "";
  document.getElementById("bl-paid").value = "";

function removeBillingEntry(idx){
  pendingBillingLog = (pendingBillingLog || []).filter(function(e, i){ return i !== parseInt(idx,10); });
  var listEl = document.getElementById("billing-log-list");

function readFieldsFromContainer(containerEl, base){
  var out = Object.assign({}, base);
  containerEl.querySelectorAll("[data-field]").forEach(function(elm){
    out[elm.getAttribute("data-field")] = elm.value;
  });
  out.billFile = pendingBillFile;
  if(pendingBillingLog !== null) out.billingLog = pendingBillingLog;
  return out;
}
function wireBillUpload(containerEl){
  var input = containerEl.querySelector("#bill-file-input");
  var statusEl = containerEl.querySelector("#bill-upload-status");
  var previewEl = containerEl.querySelector("#bill-preview");
  if(!input) return;
  input.addEventListener("change", function(){
    var f = input.files[0];
    if(!f) return;
    statusEl.textContent = "Processing…";
    readBillFile(f).then(function(bill){
      pendingBillFile = bill;
      statusEl.textContent = "";
      previewEl.innerHTML = billPreviewHtml(bill);
    }).catch(function(err){
      statusEl.innerHTML = '<span class="err">'+esc(err.message)+'</span>';
    });
  });
}

function timeAgo(iso){
  var diff = Date.now() - new Date(iso).getTime();
  var mins = Math.floor(diff/60000);
  if(mins < 1) return "just now";
  if(mins < 60) return mins+"m ago";
  var hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs+"h ago";
  var days = Math.floor(hrs/24);
  return days+"d ago";
}

/* ============ KPI dashboard (admin only) ============ */
function computeKpis(){
  var now = new Date();
  var curMonthKey = now.toISOString().slice(0,7);
  var curYear = String(now.getFullYear());

  var totals = {
    month: {electric:0, vpp:0}, year: {electric:0, vpp:0}, all: {electric:0, vpp:0}
  };
  var byMonth = {};
  APP.deals.forEach(function(d){
    (d.billingLog || []).forEach(function(entry){
      var m = entry.month;
      if(!m) return;
      var bill = parseFloat(entry.billAmount) || 0;
      var vpp = parseFloat(entry.vppRevenue) || 0;
      if(!byMonth[m]) byMonth[m] = {electric:0, vpp:0};
      byMonth[m].electric += bill;
      byMonth[m].vpp += vpp;
      totals.all.electric += bill; totals.all.vpp += vpp;
      if(m.slice(0,4) === curYear){ totals.year.electric += bill; totals.year.vpp += vpp; }
      if(m === curMonthKey){ totals.month.electric += bill; totals.month.vpp += vpp; }
    });
  });

  var flowByMonth = {};
  APP.deals.forEach(function(d){
    var im = (d.intakeDate || "").slice(0,7);
    if(im){
      if(!flowByMonth[im]) flowByMonth[im] = {added:0, lost:0};
      flowByMonth[im].added++;
    }
    if(d.status === "Cancelled" || d.status === "Will NOT send Contract"){
      var lm = (d.updatedAt || "").slice(0,7);
      if(lm){
        if(!flowByMonth[lm]) flowByMonth[lm] = {added:0, lost:0};
        flowByMonth[lm].lost++;
      }
    }
  });

  var health = {"Current":0, "30 Days Late":0, "60 Days Late":0, "Disconnected":0};
  APP.deals.forEach(function(d){
    var ps = d.paymentStatus || "Current";
    if(health.hasOwnProperty(ps)) health[ps]++;
  });
  var delinquent = health["30 Days Late"] + health["60 Days Late"] + health["Disconnected"];
  var onTime = health["Current"];
  var tracked = delinquent + onTime;
  var delinquentPct = tracked > 0 ? Math.round((delinquent/tracked)*1000)/10 : 0;
  var onTimePct = tracked > 0 ? Math.round((onTime/tracked)*1000)/10 : 0;

  return {totals:totals, byMonth:byMonth, flowByMonth:flowByMonth, health:health,
    delinquent:delinquent, onTime:onTime, delinquentPct:delinquentPct, onTimePct:onTimePct, tracked:tracked};
}
function openKpisModal(){
  var k = computeKpis();
  var months = Object.keys(k.byMonth).sort();
  var maxRev = 0;
  months.forEach(function(m){ maxRev = Math.max(maxRev, k.byMonth[m].electric, k.byMonth[m].vpp, k.byMonth[m].electric+k.byMonth[m].vpp); });
  var revBars = months.map(function(m){
    var e = k.byMonth[m].electric, v = k.byMonth[m].vpp, c = e+v;
    var eH = maxRev>0 ? Math.max(2, Math.round((e/maxRev)*160)) : 2;
    var vH = maxRev>0 ? Math.max(2, Math.round((v/maxRev)*160)) : 2;
    var cH = maxRev>0 ? Math.max(2, Math.round((c/maxRev)*160)) : 2;
    return '<div class="kpi-month"><div class="kpi-bars">' +
      '<div class="kpi-bar electric" style="height:'+eH+'px" title="Electric: '+fmtMoney(e)+'"></div>' +
      '<div class="kpi-bar vpp" style="height:'+vH+'px" title="VPP: '+fmtMoney(v)+'"></div>' +
      '<div class="kpi-bar combined" style="height:'+cH+'px" title="Combined: '+fmtMoney(c)+'"></div>' +
      '</div><div class="kpi-month-label">'+fmtMonth(m)+'</div></div>';
  }).join("");

  var flowMonths = Object.keys(k.flowByMonth).sort();
  var maxFlow = 0;
  flowMonths.forEach(function(m){ maxFlow = Math.max(maxFlow, k.flowByMonth[m].added, k.flowByMonth[m].lost); });
  var flowBars = flowMonths.map(function(m){
    var f = k.flowByMonth[m];

    '<tr style="border-top:1px solid var(--line);"><td style="padding:8px;">VPP</td><td style="text-align:right;padding:8px;">'+fmtMoney(k.totals.month.vpp)+'</td><td style="text-align:right;padding:8px;">'+fmtMoney(k.totals.year.vpp)+'</td><td style="text-align:right;padding:8px;">'+fmtMoney(k.totals.all.vpp)+'</td></tr>' +
    '<tr style="border-top:1px solid var(--line);font-weight:700;"><td style="padding:8px;">Combined</td><td style="text-align:right;padding:8px;">'+fmtMoney(k.totals.month.electric+k.totals.month.vpp)+'</td><td style="text-align:right;padding:8px;">'+fmtMoney(k.totals.year.electric+k.totals.year.vpp)+'</td><td style="text-align:right;padding:8px;">'+fmtMoney(k.totals.all.electric+k.totals.all.vpp)+'</td></tr>' +

  var healthCards = '<div class="kpi-summary">' +

function saveOwnPassword(){
  var current = document.getElementById("pc-current").value;
  var next = document.getElementById("pc-new").value;
  var confirmVal = document.getElementById("pc-confirm").value;
  var errEl = document.getElementById("pc-err");
  errEl.innerHTML = "";
  if(!next || next.length < 8){ errEl.innerHTML = '<div class="err">New password must be at least 8 characters.</div>'; return; }
  if(next !== confirmVal){ errEl.innerHTML = '<div class="err">New password and confirmation don\'t match.</div>'; return; }
  apiCall("changeMyPassword", {currentPassword: current, newPassword: next}).then(function(){
    closeModal();
  }).catch(function(err){
    errEl.innerHTML = '<div class="err">'+esc(err.message || "Something went wrong — try again.")+'</div>';
  });
}

/* ============ LOGIN ACTIONS ============ */
// First-run defaults (email/password) are created automatically, server-side,
// the first time anyone tries to log in against an empty database.
function attemptSubmitCode(code){
  code = (code || "").trim();
  if(!code){ APP.loginErr = "Enter your access code."; renderApp(); return; }
  apiCall("submitCode", {code: code}).then(function(res){
    APP.authToken = res.token;
    APP.session = {role:"partner", mode:"rep", companyId: res.session.companyId, companyName: res.session.companyName, actorName:null, actorEmail:null};
    APP.deals = [];
    APP.notifications = [];
    renderApp();
  }).catch(function(err){ APP.loginErr = err.message; renderApp(); });
}
function attemptLogin(email, password){
  email = normEmail(email);
  if(!email || !password){ APP.loginErr = "Enter your email and password."; renderApp(); return; }
  apiCall("login", {email: email, password: password}).then(function(res){
    APP.authToken = res.token;
    var s = res.session;
    if(s.role === "admin"){
      APP.session = {role:"admin", actorName: s.personName, actorEmail: s.personEmail};
      finishAdminLogin();
    } else {
      APP.session = {role:"partner", mode:"review", companyId: s.companyId, companyName: s.companyName,
        actorName: s.personName, actorEmail: s.personEmail};
      APP.partnerTab = "review";
      Promise.all([apiCall("getDeals", {companyId: s.companyId}), apiCall("getNotifications", {scope: s.companyId}), apiCall("getMessages", {companyId: s.companyId})])
        .then(function(res2){
          APP.deals = res2[0].deals || [];
          APP.notifications = res2[1].notifications || [];
          APP.messagesByCompany = {};
          APP.messagesByCompany[s.companyId] = res2[2].messages || [];
          renderApp();
          startGridRefresh();
        });
    }
  }).catch(function(err){ APP.loginErr = err.message; renderApp(); });
}
function finishAdminLogin(){
  Promise.all([apiCall("getAllDeals"), apiCall("getCompanies"), apiCall("getNotifications", {scope:"admin"}), apiCall("getAllMessages"), apiCall("getAdminTeam")])
    .then(function(res){
      APP.deals = res[0].deals || [];
      APP.companies = res[1].companies || [];
      APP.filterCo = "all"; APP.filterStatus = "all";
      APP.notifications = res[2].notifications || [];
      APP.messagesByCompany = res[3].messagesByCompany || {};
      APP.adminTeam = res[4].team || [];
      renderApp();
      startGridRefresh();
    });
}

/* ============ EVENT DELEGATION ============ */
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-action]");
  if(!t) return;
  var action = t.getAttribute("data-action");
  var id = t.getAttribute("data-id");

  if(action === "logout"){ stopGridRefresh(); APP.session = null; APP.authToken = null; APP.companies=[]; APP.deals=[]; APP.notifications=[]; APP.messagesByCompany={}; APP.adminTeam=[]; APP.showAdminField=false; APP.loginFlow="submit"; APP.searchQuery=""; APP.filterCo="all"; APP.filterStatus="all"; renderApp(); }
  else if(action === "show-admin"){ APP.showAdminField = true; APP.loginErr=""; renderApp(); }
  else if(action === "hide-admin"){ APP.showAdminField = false; APP.loginErr=""; renderApp(); }
  else if(action === "flow-access"){ APP.loginFlow = "access"; APP.loginErr=""; renderApp(); }
  else if(action === "flow-submit"){ APP.loginFlow = "submit"; APP.loginErr=""; renderApp(); }
  else if(action === "login-submit"){ attemptLogin(document.getElementById("login-email").value, document.getElementById("login-password").value); }
  else if(action === "submit-with-code"){ attemptSubmitCode(document.getElementById("submit-code").value); }
  else if(action === "ptab-review"){ APP.partnerTab = "review"; renderApp(); }
  else if(action === "ptab-submit"){ APP.partnerTab = "submit"; renderApp(); }
  else if(action === "open-add-deal"){ openAddDealModal(); }
  else if(action === "open-notifs"){ openNotifsModal(); }
  else if(action === "mark-notifs-read"){ markNotifsRead(); }
  else if(action === "open-messages"){ openMessagesModal(); }
  else if(action === "open-thread"){ openMessagesModal(id); }
  else if(action === "send-message"){ sendMessage(id); }
  else if(action === "open-companies"){ openCompaniesModal(); }
  else if(action === "open-kpis"){ openKpisModal(); }
  else if(action === "view-bill-image"){ var imgEl = t.querySelector("img"); if(imgEl) openBillLightbox(imgEl.src); }
  else if(action === "close-lightbox"){ closeLightbox(); }
  else if(action === "add-member"){ addCompanyMember(id); }
  else if(action === "remove-member"){ removeCompanyMember(id, t.getAttribute("data-mid")); }
  else if(action === "open-admin-team"){ openAdminTeamModal(); }
  else if(action === "add-admin-member"){ addAdminTeamMember(); }
  else if(action === "remove-admin-member"){ removeAdminTeamMember(id); }
  else if(action === "open-change-password"){ openChangePasswordModal(); }
  else if(action === "save-own-password"){ saveOwnPassword(); }
  else if(action === "open-edit-deal"){ openEditDealModal(id); }
  else if(action === "close-modal"){ closeModal(); }
  else if(action === "save-edit-deal"){ saveEditDeal(id); }
  else if(action === "save-add-deal"){ saveAddDeal(); }
  else if(action === "add-billing-entry"){ addBillingEntry(); }
  else if(action === "remove-billing-entry"){ removeBillingEntry(t.getAttribute("data-idx")); }
  else if(action === "save-partner-add-deal"){ savePartnerAddDeal(); }
  else if(action === "add-company"){
    var nameInput = document.getElementById("new-company-name");
    var name = nameInput.value.trim();
    if(!name) return;
    apiCall("addCompany", {name: name}).then(function(res){ APP.companies = res.companies; renderCompaniesModal(); });
  }
  else if(action === "gen-member-pw"){ genMemberPassword(id); }
  else if(action === "reset-member-pw"){ resetMemberPassword(id, t.getAttribute("data-mid")); }
  else if(action === "gen-admin-pw"){ genAdminPassword(); }
  else if(action === "reset-admin-pw"){ resetAdminMemberPassword(id); }
  else if(action === "regen-submit-code"){
    apiCall("regenSubmitCode", {companyId: id}).then(function(res){ APP.companies = res.companies; renderCompaniesModal(); });
  }
  else if(action === "remove-company"){
    apiCall("removeCompany", {companyId: id}).then(function(res){
      APP.companies = res.companies;
      APP.deals = APP.deals.filter(function(d){ return d.companyId !== id; });
      renderCompaniesModal();
    });
  }
});

document.addEventListener("input", function(e){
  var t = e.target;
  if(t.id === "search-query"){
    APP.searchQuery = t.value;
    var cursorPos = t.selectionStart;
    renderApp();
    var newEl = document.getElementById("search-query");
    if(newEl){
      newEl.focus();
      try{ newEl.setSelectionRange(cursorPos, cursorPos); }catch(e2){}
    }
  }
});
document.addEventListener("change", function(e){
  var t = e.target;
  if(t.id === "filter-co"){ APP.filterCo = t.value; renderApp(); }
  else if(t.id === "filter-status"){ APP.filterStatus = t.value; renderApp(); }
  else if(t.getAttribute && t.getAttribute("data-action") === "inline-status"){
    var dealId = t.getAttribute("data-id");
    var newStatus = t.value;
    var deal = APP.deals.filter(function(d){ return d.id === dealId; })[0];
    if(!deal) return;
    var companyId = deal.companyId;
    var custName = deal.customerName;
    var who = actorLabel();
    apiCall("getDeals", {companyId: companyId}).then(function(res){
      var arr = (res.deals || []).map(function(d){ return d.id === dealId ? Object.assign({}, d, {status:newStatus, updatedAt:new Date().toISOString(), updatedBy:who}) : d; });
      return apiCall("setDeals", {companyId: companyId, deals: arr});
    }).then(function(){
      APP.saveErr = false;
      APP.deals = APP.deals.map(function(d){ return d.id === dealId ? Object.assign({}, d, {status:newStatus, updatedAt:new Date().toISOString(), updatedBy:who}) : d; });
      renderApp();
      pushNotification(companyId, 'Status changed to "'+newStatus+'" for '+(custName||"a client")+" — by "+who);
    }).catch(function(){ APP.saveErr = true; renderApp(); });
  }
});

/* ============ INIT — nothing is fetched until a login action fires ============ */
APP.filterCo = "all"; APP.filterStatus = "all";
renderApp();

})();
